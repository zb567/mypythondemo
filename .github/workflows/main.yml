name: Python CI on testpythonaction

on: 
  push:
    branches: ["testpythonaction"]
jobs:
  build:
    runs-on: ubuntu-latest
    environment: 
      name: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'  # 启用 pip 缓存
        
    - name: Upgrade pip and setuptools
      run: |
        python -m pip install --upgrade pip setuptools

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Install build tools
      run: |
        python -m pip install --upgrade setuptools wheel
    
    - name: Build package
      run: |
        python setup.py sdist bdist_wheel

    - name: List build artifacts
      run: |
        echo "构建产物目录结构："
        ls -R dist/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: py-build-${{ github.run_id }}
        path: |
          dist/*.whl
          dist/*.tar.gz
          coverage.xml
          requirements.txt
        retention-days: 3
        if-no-files-found: error

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: py-build-${{ github.run_id }}
        path: downloaded-artifacts

    - name: Verify artifacts
      run: |
        ls -R downloaded-artifacts



        

    - name: Install ngrok
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update && sudo apt install ngrok

    - name: Authenticate ngrok
      run: |
        ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}



    


    - name: Install and Run
      run: |
        # 创建虚拟环境
        python -m venv venv
        source venv/bin/activate

        # 安装依赖
        pip install -r downloaded-artifacts/requirements.txt
    
        # 安装构建的包
        pip install downloaded-artifacts/dist/*.whl  # 或使用 tar.gz
        
        # 验证安装
        pip list | grep mypythondemo
    
        # # # 运行包中的模块（示例）
        # python -m mypythondemo.main

    - name: Start service with ngrok
      run: |
        ngrok http 8062 &
        python -m mypythondemo.main
    
        # # # 或者执行入口点命令（如果配置了 entry_points）
        # # mydemo-command --version

